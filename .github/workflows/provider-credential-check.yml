name: Protected provider credential check

on:
  workflow_dispatch:
    inputs:
      native_recovery_readback:
        description: Observe the fixed held production pair with GET requests only
        required: false
        type: boolean
        default: false
      render_env_diagnostic:
        description: Diagnose only the fixed Render service's allowlisted non-secret settings
        required: false
        type: boolean
        default: false
      render_baseline_diagnostic:
        description: Observe fixed Render service and deployment-history identities with GET only
        required: false
        type: boolean
        default: false
      render_commissioned_state_diagnostic:
        description: Evaluate the pinned failed combined release's commissioned baseline with GET only
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'aqua-lifestyle/aqua-deployment' &&
      github.repository_id == '1423239668' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.actor == 'Xolani-M' && github.actor_id == '86495928') ||
       (github.actor == 'aqualifestyleclub' && github.actor_id == '307076734')) &&
      (github.triggering_actor == 'Xolani-M' || github.triggering_actor == 'aqualifestyleclub')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-release
    env:
      PROVIDER_CHECK_MODE: ${{ inputs.render_commissioned_state_diagnostic && ((inputs.render_baseline_diagnostic || inputs.render_env_diagnostic || inputs.native_recovery_readback) && 'invalid' || 'render-commissioned-state-diagnostic') || inputs.render_baseline_diagnostic && ((inputs.render_env_diagnostic || inputs.native_recovery_readback) && 'invalid' || 'render-baseline-diagnostic') || inputs.render_env_diagnostic && (inputs.native_recovery_readback && 'invalid' || 'render-env-diagnostic') || (inputs.native_recovery_readback && 'native-recovery-readback' || 'verify') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate trusted main context without provider credentials
        run: node tools/deployment/verify-provider-credentials.mjs context
      - name: Verify fixed provider identities and GET permissions only
        if: ${{ !inputs.render_env_diagnostic && !inputs.render_baseline_diagnostic && !inputs.render_commissioned_state_diagnostic }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tools/deployment/verify-provider-credentials.mjs verify
      - name: Diagnose allowlisted Render environment reads only
        if: ${{ inputs.render_env_diagnostic && !inputs.render_baseline_diagnostic && !inputs.render_commissioned_state_diagnostic && !inputs.native_recovery_readback }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node tools/deployment/verify-provider-credentials.mjs verify
      - name: Inspect fixed Render baseline with GET only
        if: ${{ inputs.render_baseline_diagnostic && !inputs.render_env_diagnostic && !inputs.render_commissioned_state_diagnostic && !inputs.native_recovery_readback }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node tools/deployment/verify-provider-credentials.mjs verify
      - name: Diagnose commissioned baseline with fixed GET-only evidence
        if: ${{ inputs.render_commissioned_state_diagnostic && !inputs.render_baseline_diagnostic && !inputs.render_env_diagnostic && !inputs.native_recovery_readback }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/deployment/verify-provider-credentials.mjs verify
