name: Protected provider credential check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'aqua-lifestyle/aqua-deployment' &&
      github.repository_id == '1423239668' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.actor == 'Xolani-M' && github.actor_id == '86495928') ||
       (github.actor == 'aqualifestyleclub' && github.actor_id == '307076734')) &&
      (github.triggering_actor == 'Xolani-M' || github.triggering_actor == 'aqualifestyleclub')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate trusted main context without provider credentials
        run: node tools/deployment/verify-provider-credentials.mjs context
      - name: Verify fixed provider identities and GET permissions only
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tools/deployment/verify-provider-credentials.mjs verify
