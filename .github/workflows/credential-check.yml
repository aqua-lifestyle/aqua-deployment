name: Trusted evidence credential check

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  credential:
    name: Verify evidence credential
    if: >-
      github.repository == 'aqua-lifestyle/aqua-deployment' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == format('readpat-{0}', github.event.pull_request.head.sha) &&
      github.run_attempt == 1 &&
      ((github.actor == 'Xolani-M' && github.actor_id == '86495928') ||
       (github.actor == 'aqualifestyleclub' && github.actor_id == '307076734'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Recheck approved head, administrator and required safety CI without the PAT
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deployment/verify-evidence-credential.mjs context
      - name: Verify GitHub evidence reads only
        env:
          AQGREEN_EVIDENCE_READ_TOKEN: ${{ secrets.AQGREEN_EVIDENCE_READ_TOKEN }}
        run: node tools/deployment/verify-evidence-credential.mjs verify
